version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: pcdb
    environment:
      POSTGRES_USER: credtrust
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: credtrust
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  storage:
    image: minio/minio:latest
    container_name: pcstorage
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data
    ports:
      - '9000:9000'
    volumes:
      - storage_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: pcredis
    ports:
      - '6379:6379'
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: pcapi
    env_file:
      - .env
    depends_on:
      - db
      - storage
      - redis
    ports:
      - '3000:3000'
    volumes:
      - ./uploads:/app/uploads

volumes:
  db_data:
  storage_data:
